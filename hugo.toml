baseURL = "https://www.glads.fr"
title = "GLADS | Architecture · Développement · Sécurité · Informatique"
defaultContentLanguage = "fr"

enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term", "section"]

# /llms.txt : résumé du site pour les agents IA, généré depuis le contenu
# (layouts/home.llms.txt).
[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime"]

[languages]
  [languages.fr]
    locale = "fr-FR"
    contentDir = "content/fr"
    label = "Français"
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
