# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        # Vérifie l'empreinte SHA-256 publiée par Hugo avant d'installer le paquet.
        run: |
          cd ${{ runner.temp }}
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          wget -q $base/hugo_extended_${HUGO_VERSION}_linux-amd64.deb $base/hugo_${HUGO_VERSION}_checksums.txt
          sha256sum --check --ignore-missing --strict hugo_${HUGO_VERSION}_checksums.txt
          sudo dpkg -i hugo_extended_${HUGO_VERSION}_linux-amd64.deb
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Signale les URL du sitemap à Bing, Yandex, Seznam et Naver via IndexNow
  # (sans compte). La clé est publique par conception : static/955f860bbb6a278ba995319f8ce0b616.txt.
  indexnow:
    runs-on: ubuntu-24.04
    needs: deploy
    env:
      INDEXNOW_KEY: 955f860bbb6a278ba995319f8ce0b616
    steps:
      - name: Notify IndexNow
        run: |
          urls=$(curl -fsS https://www.glads.fr/sitemap.xml \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' \
            | grep -v '/veille/')
          body=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg key "$INDEXNOW_KEY" \
            '{host: "www.glads.fr", key: $key, keyLocation: ("https://www.glads.fr/" + $key + ".txt"), urlList: .}')
          echo "$body"
          curl -fsS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body" https://api.indexnow.org/indexnow
