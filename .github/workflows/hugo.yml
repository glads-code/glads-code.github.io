# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Signale les URL du sitemap à Bing, Yandex, Seznam et Naver via IndexNow
  # (sans compte). La clé est publique par conception : static/955f860bbb6a278ba995319f8ce0b616.txt.
  indexnow:
    runs-on: ubuntu-24.04
    needs: deploy
    env:
      INDEXNOW_KEY: 955f860bbb6a278ba995319f8ce0b616
    steps:
      - name: Notify IndexNow
        run: |
          urls=$(curl -fsS https://www.glads.fr/sitemap.xml \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' \
            | grep -v '/veille/')
          body=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg key "$INDEXNOW_KEY" \
            '{host: "www.glads.fr", key: $key, keyLocation: ("https://www.glads.fr/" + $key + ".txt"), urlList: .}')
          echo "$body"
          curl -fsS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body" https://api.indexnow.org/indexnow
